[project]
name = "prism-eval"
version = "0.0.1"
description = "Prism evaluation harness (W-EVAL) — Phase 0 skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=17",
]

[project.scripts]
prism-eval = "harness.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

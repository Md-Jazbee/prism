name: extension

on:
  push:
    branches: [main, master]
    paths:
      - "extensions/**"
      - "packages/prism-graph-view/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extensions/**"
      - "packages/prism-graph-view/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/extension.yml"

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build graph-view
        run: pnpm --filter @prism/graph-view build
      - name: typecheck + test + build extension
        run: |
          pnpm --filter prism-vscode typecheck
          pnpm --filter prism-vscode test
          pnpm --filter prism-vscode build
      - name: package VSIX
        run: pnpm --filter prism-vscode package
      - name: upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: prism-vscode-vsix
          path: extensions/vscode/*.vsix

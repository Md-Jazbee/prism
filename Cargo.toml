[workspace]
resolver = "2"
members = [
    "crates/prism-cli",
    "crates/prism-core",
    "crates/prism-store",
    "crates/prism-ir",
    "crates/prism-obs",
    "crates/prism-extract",
    "crates/prism-extract-python",
    "crates/prism-extract-rust",
    "crates/prism-mcp",
    "crates/prism-plan",
    "crates/prism-compile",
    "crates/prism-precise",
    "crates/prism-semantic",
    "crates/prism-bench",
    "crates/prism-api",
    "crates/prism-daemon",
]
default-members = ["crates/prism-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/prism"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
ignore = "0.4"
hex = "0.4"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
notify = "7"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

prism-ir = { path = "crates/prism-ir" }
prism-core = { path = "crates/prism-core" }
prism-store = { path = "crates/prism-store" }
prism-obs = { path = "crates/prism-obs" }
prism-extract = { path = "crates/prism-extract" }
prism-extract-python = { path = "crates/prism-extract-python" }
prism-extract-rust = { path = "crates/prism-extract-rust" }
prism-mcp = { path = "crates/prism-mcp" }
prism-plan = { path = "crates/prism-plan" }
prism-compile = { path = "crates/prism-compile" }
prism-precise = { path = "crates/prism-precise" }
prism-semantic = { path = "crates/prism-semantic" }
prism-api = { path = "crates/prism-api" }
prism-daemon = { path = "crates/prism-daemon" }

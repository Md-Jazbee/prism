# cargo-deny — P6 Stage A/B (gap G-08)
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive via notify 7; no safe upgrade yet (RUSTSEC-2024-0384).
    "RUSTSEC-2024-0384",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
# Workspace crates use `{ workspace = true }` and are unpublished; wildcards are expected.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
